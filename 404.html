<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found · Mich Candelaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Space+Mono:wght@400&display=swap">
  <style>
    :root { --bg: #F4F7F2; --ink: #122312; --ink-soft: #46543F; --brand: #2C5422; --accent: #B8D432; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0E150D; --ink: #EEF3EB; --ink-soft: #B3BFAE; --brand: #A8CF8A; } }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; background: var(--bg); color: var(--ink); font: 400 1.0625rem/1.6 "Archivo", system-ui, sans-serif; text-align: center; }
    p.code { font: 400 0.8125rem/1.4 "Space Mono", monospace; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brand); margin-bottom: 1rem; }
    h1 { font-size: clamp(1.75rem, 5vw, 2.5rem); line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 0.75rem; }
    p.lead { color: var(--ink-soft); margin-bottom: 2rem; }
    a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0.75rem 1.5rem; border-radius: 10px; background: var(--accent); color: #122312; font-weight: 600; text-decoration: none; }
    a.btn:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page doesn&rsquo;t exist.</h1>
    <p class="lead">The link may be old or mistyped.</p>
    <a class="btn" href="/">Back to the homepage</a>
  </main>
</body>
</html>
